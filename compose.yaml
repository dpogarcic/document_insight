services:
  database:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: document_insight
      POSTGRES_USER: document_insight
      POSTGRES_PASSWORD: document_insight
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_insight -d document_insight"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
