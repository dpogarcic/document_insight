services:
  # Main application service
  app:
    build: .
    image: document-insight-app:latest
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_READ_URL:?Set DATABASE_READ_URL in .env}
      - DATABASE_READ_URL=${DATABASE_READ_URL:?Set DATABASE_READ_URL in .env}
      - DATABASE_WRITE_URL=${DATABASE_WRITE_URL:?Set DATABASE_WRITE_URL in .env}
      - DATABASE_AUTH_URL=${DATABASE_AUTH_URL:?Set DATABASE_AUTH_URL in .env}
      - DATABASE_MONITOR_URL=${DATABASE_MONITOR_URL:?Set DATABASE_MONITOR_URL in .env}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:?Set MISTRAL_API_KEY in .env}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:?Set S3_ENDPOINT_URL in .env}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:?Set S3_BUCKET_NAME in .env}
      - S3_REGION=${S3_REGION:?Set S3_REGION in .env}
      - REDIS_URL=${REDIS_URL:?Set REDIS_URL in .env}
      - RQ_INGESTION_QUEUE_NAME=ingestion
      - METRICS_BEARER_TOKEN=${METRICS_BEARER_TOKEN:-}
      - PROMETHEUS_MULTIPROC_DIR=/run/prometheus-multiproc
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      bootstrap-roles:
        condition: service_completed_successfully
      prometheus-multiproc-init:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
      - prometheus-multiproc:/run/prometheus-multiproc
    command: >
      uv run --no-sync uvicorn --host 0.0.0.0 --port 8000 "src.document_insight.api.app:app"

  # Database service
  database:
    image: pgvector/pgvector:pg17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=document_insight
      - POSTGRES_PASSWORD=document_insight
      - POSTGRES_DB=document_insight
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_insight -d document_insight"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Disposable PostgreSQL instance for database isolation tests only.
  database-test:
    image: pgvector/pgvector:pg17
    profiles: [test]
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: document_insight_test_owner
      POSTGRES_PASSWORD: ${TEST_DATABASE_OWNER_PASSWORD:-}
      POSTGRES_DB: document_insight_test
      TEST_DATABASE_RUNTIME_PASSWORD: ${TEST_DATABASE_RUNTIME_PASSWORD:-}
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./tests/integration/db_init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_insight_test_owner -d document_insight_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  test-migrate:
    build: .
    profiles: [test]
    command: uv run --no-sync alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://document_insight_test_owner:${TEST_DATABASE_OWNER_PASSWORD:-}@database-test:5432/document_insight_test
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
    depends_on:
      database-test:
        condition: service_healthy
    restart: "no"

  test-bootstrap-roles:
    build: .
    profiles: [test]
    command: uv run --no-sync python -m document_insight.infrastructure.database.bootstrap_roles
    environment:
      DATABASE_URL: postgresql+asyncpg://document_insight_test_owner:${TEST_DATABASE_OWNER_PASSWORD:-}@database-test:5432/document_insight_test
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      DATABASE_READ_PASSWORD: ${DATABASE_READ_PASSWORD:-}
      DATABASE_WRITE_PASSWORD: ${DATABASE_WRITE_PASSWORD:-}
      DATABASE_AUTH_PASSWORD: ${DATABASE_AUTH_PASSWORD:-}
      DATABASE_WORKER_PASSWORD: ${DATABASE_WORKER_PASSWORD:-}
      DATABASE_RECONCILER_PASSWORD: ${DATABASE_RECONCILER_PASSWORD:-}
      DATABASE_MONITOR_PASSWORD: ${DATABASE_MONITOR_PASSWORD:-}
    depends_on:
      database-test:
        condition: service_healthy
    restart: "no"

  # Redis service
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object Storage service (S3-compatible)
  object-storage:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=document-insight
      - MINIO_ROOT_PASSWORD=document-insight-local-only
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object Storage initialization service
  object-storage-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      object-storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://object-storage:9000 document-insight document-insight-local-only;
      mc mb --ignore-existing local/document-insight-originals;
      "

  migrate:
    build: .
    image: document-insight-app:latest
    command: uv run --no-sync alembic upgrade head
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  bootstrap-roles:
    build: .
    image: document-insight-app:latest
    command: uv run --no-sync python -m document_insight.infrastructure.database.bootstrap_roles
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      DATABASE_READ_PASSWORD: ${DATABASE_READ_PASSWORD:?Set DATABASE_READ_PASSWORD in .env}
      DATABASE_WRITE_PASSWORD: ${DATABASE_WRITE_PASSWORD:?Set DATABASE_WRITE_PASSWORD in .env}
      DATABASE_AUTH_PASSWORD: ${DATABASE_AUTH_PASSWORD:?Set DATABASE_AUTH_PASSWORD in .env}
      DATABASE_WORKER_PASSWORD: ${DATABASE_WORKER_PASSWORD:?Set DATABASE_WORKER_PASSWORD in .env}
      DATABASE_RECONCILER_PASSWORD: ${DATABASE_RECONCILER_PASSWORD:?Set DATABASE_RECONCILER_PASSWORD in .env}
      DATABASE_MONITOR_PASSWORD: ${DATABASE_MONITOR_PASSWORD:?Set DATABASE_MONITOR_PASSWORD in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  prometheus-multiproc-init:
    image: busybox:1.37.0
    command: ["sh", "-c", "rm -f /run/prometheus-multiproc/*.db"]
    volumes:
      - prometheus-multiproc:/run/prometheus-multiproc
    restart: "no"

  # Worker service for background jobs
  worker:
    build: .
    image: document-insight-worker:latest
    command: >
      uv run --no-sync rq worker --with-scheduler
      --worker-class document_insight.worker.monitored.MonitoredWorker
      --url redis://redis:6379/0 ingestion
    environment:
      DATABASE_URL: ${DATABASE_WORKER_URL:?Set DATABASE_WORKER_URL in .env}
      DATABASE_WORKER_URL: ${DATABASE_WORKER_URL:?Set DATABASE_WORKER_URL in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?Set S3_ENDPOINT_URL in .env}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:?Set S3_BUCKET_NAME in .env}
      S3_REGION: ${S3_REGION:?Set S3_REGION in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:?Set MISTRAL_API_KEY in .env}
      PROMETHEUS_MULTIPROC_DIR: /run/prometheus-multiproc
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      bootstrap-roles:
        condition: service_completed_successfully
      prometheus-multiproc-init:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
      - prometheus-multiproc:/run/prometheus-multiproc

  reconciler:
    build: .
    image: document-insight-worker:latest
    command: uv run --no-sync python -m document_insight.worker.reconciler
    environment:
      DATABASE_URL: ${DATABASE_RECONCILER_URL:?Set DATABASE_RECONCILER_URL in .env}
      DATABASE_RECONCILER_URL: ${DATABASE_RECONCILER_URL:?Set DATABASE_RECONCILER_URL in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      RQ_INGESTION_QUEUE_NAME: ingestion
      JOB_RECONCILIATION_INTERVAL_SECONDS: ${JOB_RECONCILIATION_INTERVAL_SECONDS:-60}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      PROMETHEUS_MULTIPROC_DIR: /run/prometheus-multiproc
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bootstrap-roles:
        condition: service_completed_successfully
      prometheus-multiproc-init:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
      - prometheus-multiproc:/run/prometheus-multiproc

  monitoring-token-init:
    image: busybox:1.37.0
    profiles: [observability]
    environment:
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
    command: >
      sh -c 'umask 077 && printf "%s" "$$METRICS_BEARER_TOKEN" > /run/monitoring/metrics_bearer_token && chmod 0444 /run/monitoring/metrics_bearer_token'
    volumes:
      - monitoring-secrets:/run/monitoring
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.13.3
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - monitoring-secrets:/run/monitoring:ro
      - prometheus-data:/prometheus
    depends_on:
      monitoring-token-init:
        condition: service_completed_successfully
      app:
        condition: service_started

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    profiles: [observability]
    privileged: true
    command: ["--docker_only=true"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  loki:
    image: grafana/loki:3.7.0
    profiles: [observability]
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.19.2
    profiles: [observability]
    command: run /etc/alloy/config.alloy --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started

  grafana:
    image: grafana/grafana:12.4
    profiles: [observability]
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started

volumes:
  postgres-data:
  object-storage-data:
  prometheus-data:
  loki-data:
  grafana-data:
  monitoring-secrets:
  prometheus-multiproc:
