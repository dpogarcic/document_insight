services:
  # Main application service
  app:
    build: .
    image: document-insight-app:latest
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in .env}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:?Set MISTRAL_API_KEY in .env}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:?Set S3_ENDPOINT_URL in .env}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:?Set S3_BUCKET_NAME in .env}
      - S3_REGION=${S3_REGION:?Set S3_REGION in .env}
      - REDIS_URL=${REDIS_URL:?Set REDIS_URL in .env}
      - RQ_INGESTION_QUEUE_NAME=ingestion
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
    command: >
      uv run --no-sync uvicorn --host 0.0.0.0 --port 8000 "src.document_insight.api.app:app"

  # Database service
  database:
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_USER=document_insight
      - POSTGRES_PASSWORD=document_insight
      - POSTGRES_DB=document_insight
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_insight -d document_insight"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis service
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object Storage service (S3-compatible)
  object-storage:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=document-insight
      - MINIO_ROOT_PASSWORD=document-insight-local-only
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object Storage initialization service
  object-storage-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      object-storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://object-storage:9000 document-insight document-insight-local-only;
      mc mb --ignore-existing local/document-insight-originals;
      "

  migrate:
    build: .
    image: document-insight-app:latest
    command: uv run --no-sync alembic upgrade head
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  # Worker service for background jobs
  worker:
    build: .
    image: document-insight-worker:latest
    command: >
      uv run --no-sync rq worker --url redis://redis:6379/0 ingestion
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?Set S3_ENDPOINT_URL in .env}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:?Set S3_BUCKET_NAME in .env}
      S3_REGION: ${S3_REGION:?Set S3_REGION in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:?Set MISTRAL_API_KEY in .env}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  object-storage-data:
