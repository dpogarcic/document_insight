global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: document-insight-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/monitoring/metrics_bearer_token
    static_configs:
      - targets: [app:8000]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
