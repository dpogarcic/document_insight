[project]
name = "document-insight"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.15,<2",
    "asyncpg>=0.30,<1",
    "boto3>=1.40,<2",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.8,<3",
    "pwdlib[argon2]>=0.2,<1",
    "PyJWT>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.34,<1",
    "redis>=6,<7",
    "rq>=2,<3",
    "pypdf>=5,<7",
    "pillow>=11,<12",
    "pymupdf>=1.26,<2",
    "pytesseract>=0.3.13,<1",
    "spacy>=3.8,<4",
    "lingua-language-detector>=2.1,<3",
    "sentence-transformers>=3.0,<4",
    "transformers>=4.40,<5",
    "torch>=2.2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<1",
    "mypy>=1.15,<2",
    "pre-commit>=4.6,<5",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.16,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["document_insight"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-branch --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/document_insight"]
